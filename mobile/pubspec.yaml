name: biolivestock_capture
description: Native camera collection for BioLivestock AI Phase 1.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  camera: 0.12.1
  geolocator: 14.1.1
  http: 1.6.0
  image: 4.10.1
  path_provider: 2.1.6
  archive: 4.3.0
  crypto: 3.0.7
  share_plus: 13.3.1
  gal: 2.3.3
  yaml: 3.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  default-flavor: prod
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/configs/
    - assets/licenses/opencv-4.13.0.txt

