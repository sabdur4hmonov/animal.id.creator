services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biolivestock
      POSTGRES_PASSWORD: biolivestock
      POSTGRES_DB: biolivestock
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U biolivestock -d biolivestock']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - '${API_PORT:-8000}:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://biolivestock:biolivestock@db:5432/biolivestock
      SPECIES_CONFIG_DIR: /srv/species_configs
      MODEL_ROOT: /srv
      STORAGE_ROOT: /srv/data
      AUTH_CONFIG_PATH: /srv/secrets/api_keys.json
    volumes:
      - ${STORAGE_DIRECTORY:-../data}:/srv/data
      - ../models:/srv/models:ro
      - ../species_configs:/srv/species_configs:ro
      - ./.secrets:/srv/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres-data:
